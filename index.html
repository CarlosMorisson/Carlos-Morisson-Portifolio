<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carlos Eduardo Lescano Morisson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: abertura com nome e números → uma seção por empresa (coluna fixa à esquerda com o contexto, grade de projetos à direita) → competências → contato. Detalhe do projeto em painel de tela cheia. Tema escuro único. */
:root {
  --bg: #0c0c0e;
  --surface: #141417;
  --surface-2: #1b1b20;
  --line: #26262d;
  --text: #f2efe9;
  --muted: #8d8b94;
  --soft: #c8c5ce;
  --accent: #ff6a3d;
  --tone-therafy: #8cc8f2;
  --tone-sesi: #4a7bd8;
  --tone-pessoal: #c2413c;
  --display: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { background: var(--bg); color: var(--text); font-family: var(--display); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent); color: var(--bg); }
a { color: inherit; }
img, video { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 44px); }
.label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

@keyframes rise { from { transform: translateY(16px); opacity: .3; } to { transform: none; opacity: 1; } }
.rise { animation: rise .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }

/* Navegação */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .3s; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 64px; gap: 20px; }
.brand { font-weight: 700; font-size: 15px; text-decoration: none; }
.brand span { color: var(--muted); font-weight: 400; }
.nav-right { display: flex; align-items: center; gap: 28px; }
.nav-links { display: flex; gap: 24px; }
.nav-links a { text-decoration: none; font-size: 14px; color: var(--muted); transition: color .2s; }
.nav-links a:hover { color: var(--text); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { background: none; border: 0; cursor: pointer; font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.lang button:hover:not([aria-pressed="true"]) { color: var(--text); }

/* Abertura */
.hero { position: relative; overflow: hidden; }
.hero .wrap { position: relative; padding-top: clamp(56px, 9vw, 112px); padding-bottom: clamp(44px, 6vw, 72px); }
.role { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; flex-wrap: wrap; }
.hero h1 { font-size: clamp(36px, 5.2vw, 68px); line-height: 1; margin: 0; max-width: 16ch; text-wrap: balance; }
.hero h1 .line { display: inline-block; overflow: hidden; padding-bottom: .06em; }
.hero h1 .line > span { display: inline-block; animation: lineup 1.1s var(--ease) both; animation-delay: calc(var(--i) * 120ms); }
@keyframes lineup { from { transform: translateY(45%); opacity: .2; } to { transform: none; opacity: 1; } }
.hero-foot { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(28px, 5vw, 72px); margin-top: clamp(36px, 5vw, 60px); align-items: end; }
.hero-foot p { margin: 0; max-width: 52ch; font-size: clamp(17px, 1.6vw, 20px); color: var(--soft); }
.index { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); }
.index a { text-decoration: none; padding: 16px 14px 0 0; display: grid; gap: 4px; transition: color .2s; }
.index b { font-weight: 700; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; }
.index small { font-size: 13px; color: var(--muted); line-height: 1.35; transition: color .2s; }
.index a:hover small { color: var(--text); }

/* Seções de experiência */
.group { border-top: 1px solid var(--line); padding: clamp(56px, 8vw, 104px) 0; }
.group .wrap { display: grid; grid-template-columns: minmax(240px, 4fr) 9fr; gap: clamp(28px, 5vw, 72px); }
.g-side { position: sticky; top: 96px; align-self: start; }
.g-side .label { display: flex; align-items: center; gap: 10px; }
.g-side h2 { font-size: clamp(32px, 3.6vw, 48px); line-height: 1.02; margin: 14px 0 0; text-wrap: balance; }
.g-side h2 .period { display: block; color: var(--muted); font-weight: 500; font-size: .5em; margin-top: 8px; letter-spacing: 0; }
.g-side p { color: var(--soft); margin: 18px 0 0; max-width: 40ch; font-size: 16px; }
.g-side .count { margin-top: 22px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px 22px; }
.card { display: block; text-decoration: none; }
.media { position: relative; aspect-ratio: 16 / 11; border-radius: 6px; overflow: hidden; background: var(--surface); }
.media > img, .media > .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
.card:hover .media > img, .card:hover .media > .cover { transform: scale(1.035); }

/* Capa tipográfica enquanto não há imagens */
.cover {
  display: flex; flex-direction: column; justify-content: space-between; padding: clamp(14px, 2vw, 22px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.cover .plat { display: flex; gap: 6px; flex-wrap: wrap; }
.cover .plat span { font-size: 11px; font-weight: 500; letter-spacing: .04em; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.cover .ct { font-weight: 850; text-transform: uppercase; font-size: clamp(30px, 3.4vw, 50px); line-height: .88; letter-spacing: -.025em; max-width: 9ch; color: var(--text); transition: transform .7s var(--ease); }
.card:hover .cover .ct { transform: translateY(-4px); }

.card-info { padding-top: 14px; display: grid; gap: 4px; }
.card-info .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card h3 { font-weight: 650; font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.card h3 .arrow { display: inline-block; color: var(--accent); margin-left: 6px; opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .35s var(--ease); }
.card:hover h3 .arrow { opacity: 1; transform: none; }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.mtypes { display: flex; gap: 12px; flex: none; }
.mtypes span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mtypes svg { width: 11px; height: 11px; }
.tag { display: inline-block; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }

/* Competências */
.skills-sec { border-top: 1px solid var(--line); padding: clamp(56px, 8vw, 104px) 0; }
.skills-sec .wrap { display: grid; grid-template-columns: minmax(240px, 4fr) 9fr; gap: clamp(28px, 5vw, 72px); }
.skills-sec h2 { font-weight: 800; font-size: clamp(38px, 4.6vw, 64px); line-height: .95; letter-spacing: -.03em; margin: 14px 0 0; }
.skill-list { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); }
.skill { padding: 22px 24px 22px 0; border-bottom: 1px solid var(--line); }
.skill:nth-child(odd) { border-right: 1px solid var(--line); }
.skill:nth-child(even) { padding-left: 24px; }
.skill h3 { margin: 0 0 6px; font-size: 19px; font-weight: 650; }
.skill p { margin: 0; color: var(--muted); font-size: 15px; }

/* Contato */
.contact { border-top: 1px solid var(--line); padding: clamp(48px, 7vw, 88px) 0; }
.contact-row { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 28px; margin-top: 20px; }
.mail { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; font-size: clamp(20px, 2.6vw, 30px); border-bottom: 1px solid var(--line); padding-bottom: 8px; transition: border-color .25s, color .25s; }
.mail:hover { border-color: var(--text); }
.socials { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; font-size: 15px; transition: background .2s, color .2s, border-color .2s; }
.pill:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
footer { border-top: 1px solid var(--line); padding: 26px 0 40px; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* Detalhe */
dialog { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--text); overflow-y: auto; overscroll-behavior: contain; }
dialog[open] { animation: panel .6s var(--ease); }
@keyframes panel { from { transform: translateY(32px); opacity: 0; } to { transform: none; opacity: 1; } }
dialog::backdrop { background: rgba(0,0,0,.6); }
.d-top { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.d-top .wrap { display: flex; justify-content: space-between; align-items: center; height: 62px; gap: 16px; }
.d-nav { display: flex; gap: 8px; }
.icon-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; transition: background .2s, color .2s, border-color .2s; }
.icon-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
.d-head { padding: clamp(36px, 6vw, 68px) 0 30px; }
.d-head h3 { font-weight: 850; text-transform: uppercase; font-size: clamp(46px, 9vw, 124px); line-height: .86; letter-spacing: -.03em; margin: 14px 0 0; }

.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000; }
.stage > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: fade .45s ease; }
.stage video { object-fit: contain; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.stage .cover .ct { font-size: clamp(40px, 7vw, 96px); max-width: 10ch; }
.ph-video { display: grid; place-items: center; background: var(--surface); }
.ph-video div { display: grid; justify-items: center; gap: 14px; }
.ph-video .play { width: 76px; height: 76px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); display: grid; place-items: center; }
.thumbs { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
.thumbs button { position: relative; flex: 0 0 clamp(120px, 15vw, 172px); aspect-ratio: 16 / 10; padding: 0; border: 0; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--surface); opacity: .55; transition: opacity .25s; }
.thumbs button:hover, .thumbs button[aria-current="true"] { opacity: 1; }
.thumbs button[aria-current="true"]::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--text); border-radius: 4px; }
.thumbs button > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumbs .cover { padding: 10px; }
.thumbs .cover .ct { font-size: 15px; }
.thumbs .cover .plat { display: none; }
.thumbs .vt { display: grid; place-items: center; background: var(--surface-2); font-family: var(--mono); font-size: 11px; }
.d-body { display: grid; grid-template-columns: 7fr 4fr; gap: clamp(32px, 6vw, 88px); padding: clamp(40px, 6vw, 72px) 0 clamp(56px, 8vw, 96px); }
.d-body h4 { font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.lead { font-size: clamp(19px, 2vw, 23px); line-height: 1.5; margin: 0 0 40px; max-width: 58ch; }
.hl { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.hl li { padding: 14px 0; border-bottom: 1px solid var(--line); }
.facts { margin: 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 116px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.d-links { display: grid; gap: 10px; margin-top: 24px; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: 600; padding: 13px 20px; border-radius: 999px; background: var(--text); color: var(--bg); transition: background .2s; }
.btn:hover { background: var(--soft); }
.btn.off { background: none; color: var(--muted); border: 1px dashed var(--line); font-weight: 500; cursor: default; }
.note { font-size: 14px; color: var(--muted); }

/* Uma única tipografia para todos os nomes (seu nome, empresas, projetos, seções) */
.hero h1, .g-side h2, .skills-sec h2, .cover .ct, .card h3, .d-head h3 {
  font-family: var(--display); font-weight: 600; font-variation-settings: normal;
  letter-spacing: -.015em; text-transform: none; color: var(--text);
}
.cover .ct { line-height: .95; max-width: 11ch; }
.d-head h3 { line-height: .95; font-size: clamp(40px, 6.5vw, 88px); }
.skills-sec h2 { font-size: clamp(32px, 3.6vw, 48px); line-height: 1.02; }
/* Cor de cada empresa nos títulos */
.g-side h2 .gname, .card h3, .cover .ct, .d-head h3 { color: var(--tone); }

@media (max-width: 960px) {
  .group .wrap, .skills-sec .wrap { grid-template-columns: 1fr; }
  .g-side { position: static; }
}
@media (max-width: 760px) {
  .nav-links { display: none; }
  .hero-foot, .d-body { grid-template-columns: 1fr; }
  .index { grid-template-columns: repeat(2, 1fr); }
  .index a { padding-bottom: 14px; }
  .grid, .skill-list { grid-template-columns: 1fr; }
  .skill:nth-child(odd) { border-right: 0; }
  .skill:nth-child(even) { padding-left: 0; }
  .facts div { grid-template-columns: 100px 1fr; }
}
@media (max-width: 420px) { .d-nav .txt { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>

    genre: { pt: "Plataforma 2D", en: "2D platformer", es: "Plataformas 2D" },
    summary: { pt: "Meu primeiro jogo: uma planta atravessando as estações do ano.", en: "My first game: a plant journeying through the seasons.", es: "Mi primer juego: una planta atravesando las estaciones del año." },

];

const SKILLS = [
  { t: { pt: "Unity e C#", en: "Unity and C#", es: "Unity y C#" }, d: { pt: "Engine e linguagem de todos os projetos, do protótipo à entrega.", en: "The engine and language behind every project, from prototype to delivery.", es: "Motor y lenguaje de todos los proyectos, del prototipo a la entrega." } },
  { t: { pt: "Realidade virtual", en: "Virtual reality", es: "Realidad virtual" }, d: { pt: "Hand tracking, reconhecimento de poses da mão e ambientes em imagens 360°.", en: "Hand tracking, hand pose recognition and 360° image environments.", es: "Hand tracking, reconocimiento de poses de la mano y entornos con imágenes 360°." } },
  { t: { pt: "IA conversacional", en: "Conversational AI", es: "IA conversacional" }, d: { pt: "Personagens interpretados por IA em tempo real, com cenários e critérios gerados dinamicamente.", en: "Real-time AI-driven characters, with dynamically generated scenarios and criteria.", es: "Personajes interpretados por IA en tiempo real, con escenarios y criterios generados dinámicamente." } },
  { t: { pt: "Simulação e treinamento", en: "Simulation and training", es: "Simulación y capacitación" }, d: { pt: "Segurança do trabalho, EPIs, ergonomia e normas regulamentadoras como a NR10.", en: "Workplace safety, PPE, ergonomics and regulatory standards such as NR10.", es: "Seguridad laboral, EPP, ergonomía y normas regulatorias como la NR10." } },
  { t: { pt: "Jogos para terapia", en: "Games for therapy", es: "Juegos para terapia" }, d: { pt: "Dificuldade adaptativa e coleta de dados para apoiar a decisão do profissional.", en: "Adaptive difficulty and data collection to support the professional's decisions.", es: "Dificultad adaptativa y recopilación de datos para apoyar las decisiones del profesional." } },
  { t: { pt: "Python e SQL Server", en: "Python and SQL Server", es: "Python y SQL Server" }, d: { pt: "Desenvolvimento em Python e trabalho com bancos de dados SQL Server.", en: "Python development and work with SQL Server databases.", es: "Desarrollo en Python y trabajo con bases de datos SQL Server." } },
  { t: { pt: "Integração com APIs", en: "API integration", es: "Integración con APIs" }, d: { pt: "Comunicação dos jogos com serviços externos, como os modelos de IA usados em tempo real.", en: "Connecting games to external services, such as the AI models used in real time.", es: "Comunicación de los juegos con servicios externos, como los modelos de IA usados en tiempo real." } },
  { t: { pt: "Multiplataforma e localização", en: "Cross-platform and localization", es: "Multiplataforma y localización" }, d: { pt: "Projetos para VR, PC, web e celular, com localização em português, inglês e espanhol.", en: "Projects for VR, PC, web and mobile, localized in Portuguese, English and Spanish.", es: "Proyectos para VR, PC, web y móvil, localizados en portugués, inglés y español." } }
];

/* ============================================================
   IDIOMA
   ============================================================ */
const SUPPORTED = ["pt", "en", "es"];
function detectLang() {
  try { const s = localStorage.getItem("lang"); if (SUPPORTED.includes(s)) return s; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const b = String(l).slice(0, 2).toLowerCase(); if (SUPPORTED.includes(b)) return b;
  }
  return "en";
}
let lang = detectLang();
const t = k => UI[lang][k] ?? UI.en[k];
const loc = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.en ?? v.pt) : v;
const groupOf = p => GROUPS.find(g => g.id === p.group);

/* ============================================================
   COMPONENTES
   ============================================================ */
const ICON = {
  video: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2l7 4-7 4z" fill="currentColor"/></svg>',
  images: '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="1" y="2" width="10" height="8" rx="1" stroke="currentColor"/><path d="M1.5 9l3-3 2 2 1.5-1.5L11 9" stroke="currentColor"/></svg>',
  link: '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9l6-6M4.5 3H9v4.5" stroke="currentColor" stroke-width="1.2"/></svg>'
};
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function cover(p, withPlat = true) {
  const c = el("div", "cover");
  const plat = el("div", "plat");
  if (withPlat) p.plat.forEach(k => plat.append(el("span", null, t("plat")[k])));
  const ct = el("div", "ct"); ct.textContent = loc(p.title);
  c.append(plat, ct); return c;
}
/* Imagens: versão leve (720px) para cards e miniaturas; versão grande (1600px) só no destaque */
const SM = s => s + "-sm.webp", LG = s => s + ".webp";
function img(src, alt) { const i = new Image(); i.src = src; i.alt = alt; i.decoding = "async"; return i; }
function bigImg(base, alt) {
  const i = img(SM(base), alt);
  const hi = new Image(); hi.src = LG(base);
  (hi.decode ? hi.decode() : new Promise(r => hi.onload = r)).then(() => { i.src = hi.src; }).catch(() => {});
  return i;
}
const warmed = new Set();
function warm(p) { p.images.forEach(b => { if (!warmed.has(b)) { warmed.add(b); new Image().src = LG(b); } }); }
function mediaTypes(p) {
  const box = el("div", "mtypes");
  [["video", "mVideo"], ["images", "mImages"], ["link", "mLink"]].forEach(([k, label]) => {
    if (p.media[k]) box.append(el("span", null, ICON[k] + t(label)));
  });
  return box;
}
function storeName(u) {
  if (/meta\.com|oculus\.com/.test(u)) return "Meta Quest Store";
  if (/sidequestvr/.test(u)) return "SideQuest";
  if (/itch\.io/.test(u)) return "itch.io";
  return t("play");
}
function contextLine(p) {
  if (p.group !== "pessoais") return loc(groupOf(p).name);
  if (p.kind === "jam") return t("jam");
  if (p.kind === "commercial") return `${t("personal")} · ${t("commercial")}`;
  return t("personal");
}

/* ============================================================
   RENDERIZAÇÃO
   ============================================================ */
function renderIndex() {
  const box = document.getElementById("index"); box.innerHTML = "";
  const vr = PROJECTS.filter(p => p.plat.includes("vr")).length;
  [[PROJECTS.length, "ixProjects", "#therafy"], [vr, "ixVR", "#therafy"]].forEach(([n, k, href]) => {
    const a = el("a"); a.href = href; a.append(el("b", null, n), el("small", null, t(k))); box.append(a);
  });
}
function renderGroups() {
  const main = document.getElementById("groups"); main.innerHTML = "";
  GROUPS.forEach(g => {
    const items = PROJECTS.filter(p => p.group === g.id);
    const sec = el("section", "group"); sec.id = g.id; sec.style.setProperty("--tone", g.tone);
    const wrap = el("div", "wrap");
    const side = el("div", "g-side");
    side.innerHTML = `<div class="label"><span></span></div><h2><span class="gname"></span></h2><p></p><div class="label count"></div>`;
    side.querySelector(".label span").textContent = loc(g.eyebrow);
    side.querySelector(".gname").textContent = loc(g.name);
    if (g.period) { const pr = el("span", "period"); pr.textContent = "— " + loc(g.period); side.querySelector("h2").append(pr); }
    side.querySelector("p").textContent = loc(g.desc);
    side.querySelector(".count").textContent = `${String(items.length).padStart(2, "0")} ${t("projects")}`;
    const grid = el("div", "grid");
    items.forEach(p => {
      const a = el("a", "card"); a.href = "#" + p.id; a.setAttribute("aria-label", `${t("view")}: ${loc(p.title)}`);
      const m = el("div", "media"); m.append(p.images[0] ? img(SM(p.images[0]), loc(p.title)) : cover(p));
      a.addEventListener("pointerenter", () => warm(p), { once: true });
      a.addEventListener("focus", () => warm(p), { once: true });
      const info = el("div", "card-info");
      const tag = el("span", "tag"); tag.textContent = p.group === "pessoais" ? contextLine(p) : loc(p.genre);
      const row = el("div", "row");
      const h = el("h3"); h.textContent = loc(p.title); 
      row.append(h, mediaTypes(p));
      const d = el("p"); d.textContent = loc(p.summary);
      info.append(tag, row, d);
      a.append(m, info); grid.append(a);
    });
    wrap.append(side, grid); sec.append(wrap); main.append(sec);
  });
}
function renderSkills() {
  const box = document.getElementById("skills"); box.innerHTML = "";
  SKILLS.forEach(s => { const d = el("div", "skill"); d.append(el("h3"), el("p")); d.children[0].textContent = loc(s.t); d.children[1].textContent = loc(s.d); box.append(d); });
}
function applyLang() {
  document.documentElement.lang = { pt: "pt-BR", en: "en", es: "es" }[lang];
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderIndex(); renderGroups(); renderSkills();
  if (detail.open && current) openProject(current, true);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang();
}));

/* ============================================================
   DETALHE
   ============================================================ */
const detail = document.getElementById("detail");
const $ = id => document.getElementById(id);
let current = null;
function openProject(p, keep) {
  current = p; warm(p);
  const g = groupOf(p);
  detail.style.setProperty("--tone", g.tone);
  $("d-kind").textContent = `${contextLine(p)} · ${loc(p.genre)}`;
  $("d-title").textContent = loc(p.title);
  $("d-desc").textContent = loc(p.desc);
  const hl = $("d-hl"); hl.innerHTML = ""; loc(p.hl).forEach(x => { const li = el("li"); li.textContent = x; hl.append(li); });

  const facts = $("d-facts"); facts.innerHTML = "";
  const rows = [["fWhere", contextLine(p)]];
  if (p.jamTheme) rows.push(["fTheme", loc(p.jamTheme)]);
  if (p.plat.length) rows.push(["fPlat", p.plat.map(k => t("plat")[k]).join(", ")]);
  rows.push(["fEngine", "Unity"]);
  rows.push(["fMedia", [["video", "mVideo"], ["images", "mImages"], ["link", "mLink"]].filter(([k]) => p.media[k]).map(([, l]) => t(l)).join(", ")]);
  rows.forEach(([k, v]) => { const r = el("div", null, "<dt></dt><dd></dd>"); r.children[0].textContent = t(k); r.children[1].textContent = v; facts.append(r); });

  const links = $("d-links"); links.innerHTML = "";
  if (p.media.link) {
    if (p.url) { const a = el("a", "btn", `<span></span>${ICON.link.replace('viewBox', 'width="14" height="14" viewBox')}`); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; a.querySelector("span").textContent = storeName(p.url); links.append(a); }
    else { const s = el("span", "btn off"); s.textContent = t("linkSoon"); links.append(s); }
  }
  if (p.restricted) { const n = el("p", "note"); n.textContent = loc(p.restricted); links.append(n); }

  const items = [];
  if (p.media.video) items.push({ kind: "video" });
  if (p.images.length) p.images.forEach(src => items.push({ kind: "img", src }));
  else if (p.media.images) items.push({ kind: "img" }, { kind: "img" }, { kind: "img" });
  const stage = $("d-stage"), thumbs = $("d-thumbs"); thumbs.innerHTML = "";
  const show = (it, btn) => {
    stage.innerHTML = "";
    if (it.kind === "video") {
      if (p.video) { const v = el("video"); Object.assign(v, { src: p.video, controls: true, preload: "none", playsInline: true }); if (p.images[0]) v.poster = LG(p.images[0]); stage.append(v); }
      else { const ph = el("div", "ph-video", `<div><span class="play"><svg width="22" height="22" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2l7 4-7 4z" fill="currentColor"/></svg></span><span class="label"></span></div>`); ph.querySelector(".label").textContent = t("videoSoon"); stage.append(ph); }
    } else stage.append(it.src ? bigImg(it.src, loc(p.title)) : cover(p));
    thumbs.querySelectorAll("button").forEach(b => b.removeAttribute("aria-current"));
    btn && btn.setAttribute("aria-current", "true");
  };
  items.forEach((it, i) => {
    const b = el("button"); b.type = "button";
    b.setAttribute("aria-label", it.kind === "video" ? t("video") : `${loc(p.title)} ${i + 1}`);
    if (it.kind === "video") b.append(el("span", "vt", t("video")));
    else b.append(it.src ? img(SM(it.src), "") : cover(p, false));
    b.addEventListener("click", () => show(it, b)); thumbs.append(b);
  });
  thumbs.hidden = items.length < 2;
  show(items[0] || { kind: "img" }, thumbs.firstChild);

  if (!detail.open) { detail.showModal(); document.body.style.overflow = "hidden"; }
  if (!keep) detail.scrollTop = 0;
}
function step(dir) { const i = PROJECTS.indexOf(current); location.hash = PROJECTS[(i + dir + PROJECTS.length) % PROJECTS.length].id; }
function fromHash() {
  const p = PROJECTS.find(x => x.id === location.hash.slice(1));
  if (p) openProject(p); else if (detail.open) detail.close();
}
$("d-close").addEventListener("click", () => detail.close());
$("d-prev").addEventListener("click", () => step(-1));
$("d-next").addEventListener("click", () => step(1));
detail.addEventListener("keydown", e => {
  if (e.target.tagName === "VIDEO") return;
  if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1);
});
detail.addEventListener("close", () => {
  document.body.style.overflow = "";
  $("d-stage").querySelectorAll("video").forEach(v => v.pause());
  const back = current ? current.group : "";
  current = null;
  if (PROJECTS.some(x => "#" + x.id === location.hash)) {
    history.replaceState(null, "", location.pathname + location.search + (back ? "#" + back : ""));
    const s = back && document.getElementById(back); if (s) s.scrollIntoView({ block: "start" });
  }
});
addEventListener("hashchange", fromHash);

const nav = $("nav");
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });
$("yr").textContent = new Date().getFullYear();
applyLang();
fromHash();
</script>
